info:
  name: Get my bids
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/bids/my"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
